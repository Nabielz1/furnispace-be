services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: furnispace
      POSTGRES_USER: furnispace
      POSTGRES_PASSWORD: furnispace_dev
    ports:
      - "5432:5432"
    volumes:
      - furnispace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furnispace -d furnispace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  furnispace-postgres:
